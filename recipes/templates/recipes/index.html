{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Browser</title>
    <link rel="stylesheet" href="{% static 'recipes/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-4">
    <h1>Recipe Browser</h1>

    <!-- Filters -->
    <div class="row mb-3">
        <div class="col">
            <input type="text" id="searchTitle" class="form-control" placeholder="Search Title">
        </div>
        <div class="col">
            <input type="text" id="searchCuisine" class="form-control" placeholder="Filter Cuisine">
        </div>
        <div class="col">
            <input type="number" id="searchRating" class="form-control" placeholder="Min Rating">
        </div>
        <div class="col">
            <select id="pageLimit" class="form-select">
                <option value="15">15</option>
                <option value="25">25</option>
                <option value="50">50</option>
            </select>
        </div>
        <div class="col">
            <button id="searchButton" class="btn btn-primary">Search</button>
        </div>
    </div>

    <!-- Table -->
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Title</th>
                <th>Cuisine</th>
                <th>Rating</th>
                <th>Total Time</th>
                <th>Serves</th>
            </tr>
        </thead>
        <tbody id="recipeTable"></tbody>
    </table>

    <!-- Pagination -->
    <div class="d-flex justify-content-between">
        <button class="btn btn-secondary" id="prevPage" onclick="prevPage()">Previous</button>
        <span id="pageInfo"></span>
        <button class="btn btn-secondary" id="nextPage" onclick="nextPage()">Next</button>
    </div>

    <!-- Fallback -->
    <div id="noResults" class="alert alert-warning mt-4 d-none">No recipes found.</div>
</div>

<!-- Drawer Modal -->
<div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'recipes/app.js' %}"></script>
</body>
</html>
